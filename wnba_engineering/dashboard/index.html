<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courtside — WNBA Ledger</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff5f1f' stroke='%23141210' stroke-width='2.5'/%3E%3Cpath d='M2 16h28M16 2v28M6 6c6 5 6 15 0 20M26 6c-6 5-6 15 0 20' fill='none' stroke='%23141210' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead__top">
        <span class="kicker">Vol. <span data-season>—</span> · Women's National Basketball Association</span>
        <span class="kicker" data-updated></span>
      </div>
      <div class="masthead__row">
        <a href="#/" class="logo" aria-label="Courtside home">
          <span class="logo__word">Court</span><span class="logo__ball" aria-hidden="true"></span><span class="logo__word">side</span>
        </a>
        <nav class="nav" aria-label="Sections">
          <a href="#/" data-nav="home"><b>01</b> League</a>
          <a href="#/teams" data-nav="teams"><b>02</b> Teams</a>
          <a href="#/players" data-nav="players"><b>03</b> Players</a>
        </nav>
        <label class="season-pick">
          <span>Season</span>
          <select id="season"></select>
        </label>
      </div>
    </header>
    <div class="ticker" aria-hidden="true"><div class="ticker__track" id="ticker"></div></div>

    <main id="app" class="page">
      <p class="loading">Warming up…</p>
    </main>

    <footer class="colophon">
      <span>Courtside — built from the wnba-engineering ETL. Box scores via ESPN.</span>
      <span>Game Score: J. Hollinger · TS% = PTS / 2(FGA + 0.44 FTA)</span>
    </footer>

    <div class="tip" id="tip" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
